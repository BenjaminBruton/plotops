version: '3.8'

# Development-specific overrides
# This file is automatically loaded by docker-compose and overrides/extends docker-compose.yml

services:
  supabase-db:
    environment:
      # Development-specific database settings
      POSTGRES_LOG_STATEMENT: all
      POSTGRES_LOG_MIN_DURATION_STATEMENT: 0
      POSTGRES_SHARED_PRELOAD_LIBRARIES: pg_stat_statements
    volumes:
      # Mount development SQL scripts
      - ./tools/dev/sql:/dev-sql:ro
    ports:
      # Expose additional ports for development tools
      - "5432:5432"

  supabase-studio:
    environment:
      # Development Studio settings
      NEXT_PUBLIC_ENABLE_LOGS: true
      STUDIO_PG_META_URL: http://supabase-meta:8080
    volumes:
      # Hot reload for custom studio configurations
      - ./services/supabase/studio-config:/app/studio-config:ro

  supabase-kong:
    volumes:
      # Development Kong configuration with CORS enabled
      - ./services/supabase/kong.dev.yml:/var/lib/kong/kong.yml:ro

  n8n:
    environment:
      # Development n8n settings
      - N8N_LOG_LEVEL=debug
      - N8N_DISABLE_PRODUCTION_MAIN_PROCESS=true
      - N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN=true
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
    volumes:
      # Mount development workflows and custom nodes
      - ./services/n8n-workflows:/home/node/.n8n/workflows
      - ./services/n8n-custom-nodes:/home/node/.n8n/custom
      - ./tools/dev/n8n-backups:/backups

  # Development-only services
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: plotops-pgadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@plotops.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-plotops123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./services/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - supabase-db
    networks:
      - plotops-network

  # Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: plotops-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-plotops-redis-password}
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-plotops123}
    depends_on:
      - redis
    networks:
      - plotops-network

  # Development proxy for API testing
  nginx-dev:
    image: nginx:alpine
    container_name: plotops-nginx-dev
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./services/nginx/dev.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx/cors.conf:/etc/nginx/cors.conf:ro
    depends_on:
      - supabase-kong
      - n8n
    networks:
      - plotops-network

  # File watcher for hot reloading
  file-watcher:
    image: node:18-alpine
    container_name: plotops-file-watcher
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "
        npm install -g nodemon chokidar-cli &&
        chokidar 'services/**/*' 'tools/**/*' --initial --verbose --ignore 'node_modules' --ignore '.git' -c 'echo File changed: {path} at {time}'
      "
    networks:
      - plotops-network

volumes:
  pgadmin-data:

networks:
  plotops-network:
    external: false