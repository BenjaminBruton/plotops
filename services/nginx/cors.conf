# CORS Configuration for PlotOps Development Environment

# Set CORS headers for all requests
set $cors_origin "";
set $cors_cred "";
set $cors_header "";
set $cors_method "";

# Check if origin is allowed
if ($http_origin ~ '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:[0-9]+)?$') {
    set $cors_origin $http_origin;
    set $cors_cred "true";
    set $cors_header "Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since,apikey,X-Client-Info";
    set $cors_method "GET,POST,PUT,PATCH,DELETE,OPTIONS";
}

# Apply CORS headers
add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Credentials $cors_cred always;
add_header Access-Control-Allow-Headers $cors_header always;
add_header Access-Control-Allow-Methods $cors_method always;
add_header Access-Control-Max-Age 86400 always;

# Handle preflight requests
if ($request_method = 'OPTIONS') {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials $cors_cred always;
    add_header Access-Control-Allow-Headers $cors_header always;
    add_header Access-Control-Allow-Methods $cors_method always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Content-Type text/plain;
    add_header Content-Length 0;
    return 204;
}